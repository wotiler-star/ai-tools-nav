version: "3.8"

# 后端依赖：MySQL 8 + Redis 7 + Elasticsearch 8 + Nacos 2
# 中间件均独立容器，按需启用（默认 local profile 仍免外部服务）。
services:
  mysql:
    image: mysql:8.0
    container_name: ai-nav-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ai_nav
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7.0
    container_name: ai-nav-redis
    restart: always
    ports:
      - "6379:6379"

  elasticsearch:
    image: elasticsearch:8.13.4
    container_name: ai-nav-es
    restart: always
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data

  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: ai-nav-nacos
    restart: always
    environment:
      - MODE=standalone
      - PREFER_HOST_MODE=hostname
      - NACOS_AUTH_ENABLE=false
    ports:
      - "8848:8848"
    volumes:
      - nacos-data:/home/nacos/data

volumes:
  mysql-data:
  es-data:
  nacos-data:
