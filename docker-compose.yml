version: "3.8"

# 后端依赖：MySQL 8 + Redis 7（对齐 ai.codefather.cn 后端栈）
services:
  mysql:
    image: mysql:8.0
    container_name: ai-nav-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ai_nav
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7.0
    container_name: ai-nav-redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  mysql-data:
