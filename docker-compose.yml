# AI 导航站 —— 一键全栈编排
# 中间件：MySQL / Redis / Elasticsearch / Nacos
# 应用层：backend(Spring Boot) / frontend(Next.js) / nginx(反代)
#
# 用法：
#   docker compose up -d                 # 起全部（含 ES/Nacos，较慢）
#   docker compose up -d mysql redis backend frontend nginx   # 最小可用（不含 ES/Nacos）
#   docker compose down                  # 停止并移除容器（数据卷保留）
#   docker compose down -v               # 连数据卷一起删（清空 MySQL 数据）

services:
  # ---------- 基础设施中间件 ----------
  mysql:
    image: mysql:8.0
    container_name: ai-nav-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ai_nav
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
    volumes:
      - mysql-data:/var/lib/mysql
      - ./backend/sql:/docker-entrypoint-initdb.d:ro   # 首次启动自动建表 + 灌种子数据
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - ainav-net

  redis:
    image: redis:7.0
    container_name: ai-nav-redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ainav-net

  elasticsearch:
    image: elasticsearch:8.13.4
    container_name: ai-nav-es
    restart: always
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    networks:
      - ainav-net

  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: ai-nav-nacos
    restart: always
    environment:
      - MODE=standalone
      - PREFER_HOST_MODE=hostname
      - NACOS_AUTH_ENABLE=false
    ports:
      - "8848:8848"
    volumes:
      - nacos-data:/home/nacos/data
    networks:
      - ainav-net

  # ---------- 应用层 ----------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-nav-backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # 覆盖 application.yml 的 localhost 默认值，指向 compose 服务名
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ai_nav?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=utf8&characterSetResults=utf8mb4&characterSetConnection=utf8mb4&connectionCollation=utf8mb4_unicode_ci&useUnicode=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
    ports:
      - "8123:8123"
    networks:
      - ainav-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE: "/api"
        NEXT_PUBLIC_USE_MOCK: "false"
        # Google Search Console 验证 token（meta 标签验证方式）
        NEXT_PUBLIC_GOOGLE_VERIFICATION: "vQo4IPxyowoMzJqw_p1Hz2INidvCN1HvZk93FYHB3PM"
    container_name: ai-nav-frontend
    restart: always
    depends_on:
      - backend
    networks:
      - ainav-net

  nginx:
    image: nginx:1.27-alpine
    container_name: ai-nav-nginx
    restart: always
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # 健康巡检脚本与动态门控状态文件：watcher 在容器内探测上游并改写状态、重载 nginx
      - ./nginx/health-watch.sh:/usr/local/bin/health-watch.sh:ro
      - ./nginx/health_state.conf:/etc/nginx/health_state.conf:rw
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    # 启动 nginx 的同时后台运行健康巡检；exec 让 nginx 拿到 PID 1 以正确处理信号
    command: ["sh", "-c", "/usr/local/bin/health-watch.sh & exec nginx -g 'daemon off;'"]
    networks:
      - ainav-net

volumes:
  mysql-data:
  es-data:
  nacos-data:

networks:
  ainav-net:
    driver: bridge
