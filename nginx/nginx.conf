# AI 导航站 —— 生产 Nginx 配置（HTTPS，域名 www.startoday.cc）
# 前置：证书由 certbot 写入 /etc/letsencrypt/live/www.startoday.cc/
#       docker-compose 已将 /etc/letsencrypt 与 /var/www/certbot 挂载进容器

upstream ainav_front { server frontend:3000; }
upstream ainav_api   { server backend:8123; }

# HTTP：ACME 校验目录 + 全站跳转 HTTPS
server {
    listen 80;
    server_name www.startoday.cc startoday.cc;

    # Let's Encrypt 校验目录（certbot webroot 模式续期用）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    http2 on;
    server_name www.startoday.cc startoday.cc;

    ssl_certificate     /etc/letsencrypt/live/www.startoday.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.startoday.cc/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # 前端站点（Next.js）
    location / {
        proxy_pass http://ainav_front;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 后端 API（context-path 已是 /api，此处透传）
    location /api/ {
        proxy_pass http://ainav_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Sa-Token SESSION Cookie：必须透传 Cookie 才能保持登录态
        proxy_set_header Cookie $http_cookie;
    }
}
