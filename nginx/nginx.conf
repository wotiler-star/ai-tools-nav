upstream ainav_front { server frontend:3000; }
upstream ainav_api   { server backend:8123; }

server {
    listen 80;
    server_name _;

    # 前端站点（Next.js）
    location / {
        proxy_pass http://ainav_front;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 后端 API（后端 context-path 已是 /api，此处透传）
    location /api/ {
        proxy_pass http://ainav_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Sa-Token 使用 SESSION Cookie，必须透传 Cookie 才能保持登录态
        proxy_set_header Cookie $http_cookie;
    }
}
