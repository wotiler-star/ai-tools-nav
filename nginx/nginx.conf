# AI 导航站 HTTPS 正式配置（性能优化版 2026-09-04）
# 变更点：gzip 压缩 / 静态资源长效缓存 / 安全响应头 / HTTP2 / 代理超时与缓冲
# 回滚：cp nginx/nginx.conf.pre-optimize-20260904.bak nginx/nginx.conf
upstream ainav_front { server frontend:3000; }
upstream ainav_api   { server backend:8123; }

# ---------- 压缩 ----------
# 只压文本类资源；图片/字体等二进制本身已压缩，再压纯浪费 CPU
gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_proxied any;
gzip_buffers 16 8k;
gzip_http_version 1.1;
gzip_types
    text/plain
    text/css
    text/xml
    application/javascript
    application/x-javascript
    application/json
    application/xml
    application/rss+xml
    application/atom+xml
    image/svg+xml
    application/manifest+json
    application/vnd.ms-fontobject
    font/ttf;

# ---------- HTTP 80：ACME 校验 + 全站跳 HTTPS ----------
server {
    listen 80;
    server_name www.toolly.cc toolly.cc;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS 443 ----------
server {
    listen 443 ssl http2;
    server_name www.toolly.cc toolly.cc;

    ssl_certificate     /etc/letsencrypt/live/www.toolly.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.toolly.cc/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 10m;
    client_body_timeout 30s;
    client_header_timeout 30s;
    send_timeout 60s;

    # ---------- 安全响应头（server 级统一定义，子级不再重复 add_header 以免覆盖）----------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ---------- Next.js 带 hash 的静态产物：内容不变，可长期强缓存 ----------
    location /_next/static/ {
        proxy_pass http://ainav_front;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        expires 1y;
        access_log off;
    }

    # ---------- public/ 下的静态资源 ----------
    location ~* ^/(favicon\.ico|robots\.txt|sitemap\.xml|logo|images/|icons/).*$ {
        proxy_pass http://ainav_front;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=86400" always;
        expires 1d;
        access_log off;
    }

    # ---------- 后端 API：绝不缓存 ----------
    location /api/ {
        proxy_pass http://ainav_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 16 8k;

        # 子级 add_header 会覆盖父级，这里显式重放安全头
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # ---------- 前端站点（Next.js 页面，Cache-Control 交给 Next 自己控制）----------
    location / {
        proxy_pass http://ainav_front;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
