# HTTPS 正式配置（证书就绪后启用）
# 启用方式：cp nginx/nginx.conf.ssl nginx/nginx.conf && docker compose up -d nginx
upstream ainav_front { server frontend:3000; }
upstream ainav_api   { server backend:8123; }

# HTTP 80：仅用于 Let's Encrypt ACME 校验 + 全站 301 跳转 HTTPS
server {
    listen 80;
    server_name www.toolly.cc toolly.cc;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 443
server {
    listen 443 ssl;
    server_name www.toolly.cc toolly.cc;

    ssl_certificate     /etc/letsencrypt/live/www.toolly.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.toolly.cc/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 前端站点（Next.js）
    location / {
        proxy_pass http://ainav_front;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 后端 API（context-path 已是 /api）
    location /api/ {
        proxy_pass http://ainav_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
    }
}
