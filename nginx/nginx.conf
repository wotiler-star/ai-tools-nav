# AI 导航站 —— Nginx 配置
# 域名：www.toolly.cc（主）/ toolly.cc（根域）
# HTTP 版：DNS 指向本机后即可访问；.well-known 目录已就绪，可随时申请 HTTPS 证书。
upstream ainav_front { server frontend:3000; }
upstream ainav_api   { server backend:8123; }

server {
    listen 80;
    # 同时接受 www、根域与 IP 访问
    server_name www.toolly.cc toolly.cc 43.155.171.45;

    # Let's Encrypt 校验目录（证书申请/续期用，保持为空目录即可）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 前端站点（Next.js）
    location / {
        proxy_pass http://ainav_front;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 后端 API（context-path 已是 /api）
    location /api/ {
        proxy_pass http://ainav_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
    }
}
