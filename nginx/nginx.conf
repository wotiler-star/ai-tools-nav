# 临时 HTTP-only 配置：用于 DNS 尚未指向本机 / 证书未申请时的验证
# 证书就绪后切回 nginx.conf（含 443 HTTPS）
upstream ainav_front { server frontend:3000; }
upstream ainav_api   { server backend:8123; }

server {
    listen 80;
    server_name _;

    # Let's Encrypt 校验目录（证书申请/续期用，保持为空目录即可）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 前端站点（Next.js）
    location / {
        proxy_pass http://ainav_front;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 后端 API（context-path 已是 /api）
    location /api/ {
        proxy_pass http://ainav_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
    }
}
