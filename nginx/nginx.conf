# AI 导航站 HTTPS 正式配置（性能优化版 2026-09-04）
# 变更点：gzip 压缩 / 静态资源长效缓存 / 安全响应头 / HTTP2 / 代理超时与缓冲
# 回滚：cp nginx/nginx.conf.pre-optimize-20260904.bak nginx/nginx.conf
# ---------- 上游容器：运行时动态解析 ----------
# nginx 开源版仅在启动时解析 upstream 中的主机名一次；上游容器被 recreate 后
# IP 变化，nginx 仍连旧 IP → 502。改用「resolver + 变量形式 proxy_pass」，
# 让主机名在请求时才解析（结果缓存 10s），上游重建后自动恢复，无需重启 nginx。
# 127.0.0.11 = Docker 内嵌 DNS（容器需位于用户自定义网络）。
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

# ---------- 上游健康门控（由 health-watch.sh 动态改写）----------
include /etc/nginx/health_state.conf;

# ---------- 压缩 ----------
# 只压文本类资源；图片/字体等二进制本身已压缩，再压纯浪费 CPU
# cov42：补 text/x-component（Next.js App Router 的 RSC 载荷类型）。
# 点地球地区（?src=）做客户端导航时会下载整份 RSC，未压缩约 1.7MB → 传输 4~7s。
gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_proxied any;
gzip_buffers 16 8k;
gzip_http_version 1.1;
gzip_types
    text/plain
    text/css
    text/xml
    text/x-component
    application/javascript
    application/x-javascript
    application/json
    application/xml
    application/rss+xml
    application/atom+xml
    image/svg+xml
    application/manifest+json
    application/vnd.ms-fontobject
    font/ttf;

# ---------- HTTP 80：ACME 校验 + 全站跳 HTTPS ----------
server {
    listen 80;
    server_name www.toolly.cc toolly.cc;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS 443 ----------
server {
    listen 443 ssl http2;
    server_name www.toolly.cc toolly.cc;

    # 上游容器地址：变量形式，配合 resolver 在请求时解析
    set $up_front "frontend:3000";
    set $up_api   "backend:8123";

    ssl_certificate     /etc/letsencrypt/live/www.toolly.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.toolly.cc/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 10m;
    client_body_timeout 30s;
    client_header_timeout 30s;
    send_timeout 60s;

    # ---------- 安全响应头（server 级统一定义，子级不再重复 add_header 以免覆盖）----------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ---------- Next.js 带 hash 的静态产物：内容不变，可长期强缓存 ----------
    location /_next/static/ {
        proxy_pass http://$up_front;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        expires 1y;
        access_log off;
    }

    # ---------- public/ 下的静态资源 ----------
    location ~* ^/(favicon\.ico|robots\.txt|sitemap\.xml|logo|images/|icons/).*$ {
        proxy_pass http://$up_front;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=86400" always;
        expires 1d;
        access_log off;
    }

    # ---------- 后端 API：绝不缓存 ----------
    location /api/ {
        proxy_intercept_errors on;
        if ($backend_down = 1) {
            return 503;
        }
        error_page 502 503 504 = @maintenance;

        proxy_pass http://$up_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 16 8k;

        # 子级 add_header 会覆盖父级，这里显式重放安全头
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # ---------- 前端站点（Next.js 页面，Cache-Control 交给 Next 自己控制）----------
    location / {
        proxy_pass http://$up_front;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_intercept_errors on;
        if ($frontend_down = 1) {
            return 503;
        }
        error_page 502 503 504 = @maintenance;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location @maintenance {
        default_type text/html;
        return 503 '<!doctype html><html><head><meta charset="utf-8"><title>维护中</title></head><body style="font-family:sans-serif;margin:0;display:flex;min-height:100vh;align-items:center;justify-content:center"><div style="text-align:center"><h1>服务维护中</h1><p>系统暂时不可用，请稍后重试。</p></div></body></html>';
    }
}

# ---------- starteday.com（全球资讯站）----------
# cov36 补：该站由 global-headlines 容器提供（compose 只发布 8082，并接入 ainav-net）。
# 80/443 由本 nginx 统管，但此前缺 starteday 的 server 块，请求落到 default server 返回 404。
server {
    listen 80;
    server_name starteday.com www.starteday.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name starteday.com www.starteday.com;

    # 上游容器地址：变量形式，配合 http 层 resolver 在请求时解析
    set $up_global "global-headlines:3000";

    ssl_certificate     /etc/letsencrypt/live/www.starteday.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.starteday.com/privkey.pem;

    location / {
        proxy_intercept_errors on;
        if ($global_down = 1) {
            return 503;
        }
        error_page 502 503 504 = @maintenance;

        proxy_pass http://$up_global;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }

    location @maintenance {
        default_type text/html;
        return 503 '<!doctype html><html><head><meta charset="utf-8"><title>维护中</title></head><body style="font-family:sans-serif;margin:0;display:flex;min-height:100vh;align-items:center;justify-content:center"><div style="text-align:center"><h1>服务维护中</h1><p>系统暂时不可用，请稍后重试。</p></div></body></html>';
    }
}
