# ===== 本地联调 profile：H2 内存数据库 + 免 Redis =====
# 启动：java -jar ai-nav-web.jar --spring.profiles.active=local
spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: org.h2.Driver
    # MySQL 兼容模式；NON_KEYWORDS=USER 让 user 表名可用；DB_CLOSE_DELAY=-1 保持内存库存活
    url: jdbc:h2:mem:ai_nav;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;NON_KEYWORDS=USER
    username: sa
    password:
    druid:
      validation-query: SELECT 1
  # 启动时用 H2 兼容脚本初始化建表 + 灌数据
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql
      encoding: UTF-8
  # 本地不用 Redis：排除自动配置，Sa-Token 走内存存储
  # 关键：必须同时排除 sa-token 的 Redis DAO 实现（它强依赖 RedisTemplate），
  #       否则 local 启动会因“找不到 RedisTemplate”而失败。排除后回退为内存 SaTokenDao。
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - cn.dev33.satoken.dao.SaTokenDaoRedisJackson

# 分页方言切换为 H2（生产默认 mysql）
mybatis-plus:
  db-type: h2
