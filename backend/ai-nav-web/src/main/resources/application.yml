server:
  port: 8123
  servlet:
    context-path: /api   # 前端 API_BASE 默认 http://localhost:8123/api

spring:
  application:
    name: ai-nav
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ai_nav?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      test-while-idle: true
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
  # Elasticsearch：依赖声明后默认不启用搜索（es profile 才打开），避免无 ES 时影响启动
  elasticsearch:
    uris: http://localhost:9200
  cloud:
    nacos:
      discovery:
        enabled: false   # nacos profile 置 true 才会注册到 Nacos
      config:
        enabled: false   # Nacos 配置中心如需启用，请另配 bootstrap.yml

# 中间件开关（profile 维度启用，默认全关，保证 local / 默认 profile 无需外部服务即可启动）
ainav:
  es:
    enabled: false
    index: ai_tool
    host: http://localhost:9200
  cache:
    enabled: false       # prod profile 置 true 开启 Redis 查询缓存（local 不开启）

# Sa-Token：SESSION Cookie 登录认证（与前端 credentials:include 对应）
# 说明：引入 sa-token-redis-jackson 且 Redis 可用时，token 自动存储到 Redis；
#       local profile 排除 Redis，则回退为内存存储。
sa-token:
  token-name: satoken
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-log: false

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
  mapper-locations: classpath*:/mapper/**/*.xml

# Knife4j 接口文档（访问 /doc.html）
knife4j:
  enable: true
  openapi:
    title: AI 导航站 API
    version: 1.0.0
    description: 复刻 api.codefather.cn
    group:
      default:
        api-rule: package
        api-rule-resources:
          - com.ainav.controller

logging:
  level:
    com.ainav: info
